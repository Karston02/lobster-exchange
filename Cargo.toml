# Workspace root. A "workspace" groups several Rust packages ("crates")
# that share one build folder and one lockfile. We start with just the
# engine and add crates (replay, python bindings, server) as we go.
[workspace]
resolver = "2"
members = ["crates/engine", "crates/recorder", "crates/replay", "crates/py"]
# Plain `cargo build` / `cargo test` skip the Python bindings: they're built
# by maturin, which knows how to link them against Python.
default-members = ["crates/engine", "crates/recorder", "crates/replay"]

[workspace.package]
edition = "2024"
license = "MIT"
